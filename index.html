                                {lang === 'en' ? 'Selected Work' : 'Projets Sélectionnés'}
                            </h2>
                            <p className="text-zinc-500">
                                {lang === 'en' ? 'A collection of shipping code.' : 'Une collection de code livré.'}
                            </p>
                        </div>
                    </div>

                    {/* CSS Columns Masonry Layout */}
                    <div className="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
                        {DATA.projects.map((project, index) => (
                            <ProjectCard key={project.id} project={project} lang={lang} index={index} />
                        ))}
                    </div>
                </section>
            );
        };

        const ContactModal = ({ isOpen, onClose, lang }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center px-4">
                    <div 
                        className="absolute inset-0 bg-black/60 backdrop-blur-sm" 
                        onClick={onClose}
                    ></div>
                    <motion.div 
                        initial={{ scale: 0.9, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        exit={{ scale: 0.9, opacity: 0 }}
                        className="relative w-full max-w-md bg-bg-card border border-white/10 rounded-2xl p-8 shadow-2xl"
                    >
                        <button 
                            onClick={onClose}
                            className="absolute top-4 right-4 text-zinc-500 hover:text-white"
                        >
                            <Icons.X />
                        </button>
                        
                        <h3 className="text-2xl font-bold text-white mb-2">
                            {lang === 'en' ? 'Let\'s talk.' : 'Discutons.'}
                        </h3>
                        <p className="text-zinc-400 mb-6 text-sm">
                            {lang === 'en' 
                                ? 'Have a project in mind? Send me a message directly.' 
                                : 'Un projet en tête ? Envoyez-moi un message directement.'}
                        </p>

                        <a 
                            href={`mailto:${DATA.profile.email}?subject=Project Inquiry`}
                            className="flex items-center justify-center gap-2 w-full bg-white text-black font-bold py-4 rounded-lg hover:bg-accent hover:text-black transition-colors mb-4"
                        >
                            <Icons.Send size={18} />
                            {lang === 'en' ? 'Send Email' : 'Envoyer un Email'}
                        </a>
                        
                        <div className="text-center">
                            <p className="text-xs text-zinc-600 font-mono">
                                {DATA.profile.email}
                            </p>
                        </div>
                    </motion.div>
                </div>
            );
        };

        const FAB = ({ onClick }) => {
            return (
                <motion.button
                    initial={{ scale: 0 }}
                    animate={{ scale: 1 }}
                    whileHover={{ scale: 1.1 }}
                    whileTap={{ scale: 0.9 }}
                    onClick={onClick}
                    className="fixed bottom-8 right-8 z-40 w-14 h-14 bg-accent text-black rounded-full shadow-[0_0_20px_rgba(204,255,0,0.3)] flex items-center justify-center hover:shadow-[0_0_30px_rgba(204,255,0,0.5)] transition-shadow"
                >
                    <Icons.Mail />
                </motion.button>
            );
        };

        const Footer = () => {
            return (
                <footer className="py-12 border-t border-white/5 text-center text-zinc-600 text-sm font-mono">
                    <p>&copy; {new Date().getFullYear()} Oussama Berrada Ifriqi.</p>
                    <p className="mt-2 text-xs opacity-50">Built with React, Tailwind & Framer Motion.</p>
                </footer>
            );
        }

        const App = () => {
            const [lang, setLang] = useState('en');
            const [isModalOpen, setIsModalOpen] = useState(false);

            return (
                <div className="min-h-screen bg-bg selection:bg-accent selection:text-black">
                    <Nav lang={lang} setLang={setLang} />
                    
                    <main>
                        <Hero lang={lang} />
                        <Marquee />
                        <Experience lang={lang} />
                        <WorkGrid lang={lang} />
                    </main>

                    <Footer />
                    
                    <FAB onClick={() => setIsModalOpen(true)} />
                    
                    <AnimatePresence>
                        {isModalOpen && (
                            <ContactModal 
                                isOpen={isModalOpen} 
                                onClose={() => setIsModalOpen(false)} 
                                lang={lang} 
                            />
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
